[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statcheck-ml"
version = "0.1.0"
description = "Find reported statistical results with a learned model, then check them with exact mathematics."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
train = ["torch>=2.0"]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
pdf = ["pymupdf>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statcheck_ml = ["spec/*.json"]
